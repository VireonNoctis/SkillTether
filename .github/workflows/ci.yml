name: SkillTether CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run regression and property-based tests
        run: coverage run -m pytest
      - name: Report line and branch coverage
        run: coverage report -m
      - name: Enforce aggregate coverage floor on Linux baseline
        if: runner.os == 'Linux'
        run: coverage report --fail-under=80 -m
      - name: Validate JSON Schema syntax and protected-token policy
        run: |
          python -m json.tool schemas/invariant-manifest.schema.json > /dev/null
          python -m json.tool schemas/comparison-report.schema.json > /dev/null
          python - <<'PY'
          from skilltether.analysis import load_policy
          from skilltether.translation import _mask_protected_spans
          patterns, tokens = load_policy("config/protected-tokens.yaml")
          _mask_protected_spans("Use $API_TOKEN at references/guide.md", patterns, tokens)
          PY
      - name: Validate bundled fixture package
        run: skilltether validate tests/fixtures/valid-skill

  reference-conformance:
    # The upstream skills-ref README describes this as a demonstration/reference
    # implementation. Pin it for a non-runtime compatibility smoke check only.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go for the reference CLI
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install pinned Agent Skills reference validator
        run: go install github.com/skills-repos/agentskills/skills-ref/cmd/skills-ref@v0.0.1
      - name: Check a valid and invalid fixture against skills-ref
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          skills-ref --version
          skills-ref validate tests/fixtures/valid-skill
          set +e
          skills-ref validate tests/fixtures/invalid-skill
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Expected skills-ref to return 1 for the invalid fixture, got $status" >&2
            exit 1
          fi
