name: SkillTether CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Feature branches are validated by their pull_request event. Avoid duplicate
# push + pull_request matrices and stop obsolete runs when a PR head advances.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run regression and property-based tests
        run: coverage run -m pytest
      - name: Report line and branch coverage
        run: coverage report -m
      - name: Enforce aggregate coverage floor on Linux baseline
        if: runner.os == 'Linux'
        run: coverage report --fail-under=80 -m
      - name: Validate JSON Schema syntax and protected-token policy
        run: |
          python -m json.tool schemas/invariant-manifest.schema.json > /dev/null
          python -m json.tool schemas/comparison-report.schema.json > /dev/null
          python - <<'PY'
          from skilltether.analysis import load_policy
          from skilltether.translation import _mask_protected_spans
          patterns, tokens = load_policy("config/protected-tokens.yaml")
          _mask_protected_spans("Use $API_TOKEN at references/guide.md", patterns, tokens)
          PY
      - name: Validate bundled fixture packages
        run: |
          skilltether validate tests/fixtures/valid-skill
          skilltether validate tests/fixtures/valid-optional-skill
          skilltether validate tests/fixtures/café-tool
          skilltether validate tests/fixtures/éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé
          skilltether validate tests/fixtures/extension-skill
          skilltether validate tests/fixtures/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          set +e
          skilltether validate tests/fixtures/bad--name
          invalid_boundary_status=$?
          set -e
          if [[ "$invalid_boundary_status" -ne 1 ]]; then
            echo "Expected SkillTether to reject the invalid boundary fixture with status 1, got $invalid_boundary_status" >&2
            exit 1
          fi
          set +e
          skilltether validate tests/fixtures/ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé
          unicode_invalid_status=$?
          set -e
          if [[ "$unicode_invalid_status" -ne 1 ]]; then
            echo "Expected SkillTether to reject the 65-character Unicode name fixture with status 1, got $unicode_invalid_status" >&2
            exit 1
          fi

  reference-conformance:
    # The upstream skills-ref README describes this as a demonstration/reference
    # implementation. Pin it for a non-runtime compatibility smoke check only.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go for the reference CLI
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install pinned Agent Skills reference validator
        run: go install github.com/skills-repos/agentskills/skills-ref/cmd/skills-ref@v0.0.1
      - name: Check a valid and invalid fixture against skills-ref
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          skills-ref --version
          skills-ref validate tests/fixtures/valid-skill
          skills-ref validate tests/fixtures/valid-optional-skill
          skills-ref validate tests/fixtures/café-tool
          skills-ref validate tests/fixtures/éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé
          skills-ref validate tests/fixtures/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          set +e
          skills-ref validate tests/fixtures/invalid-skill
          status=$?
          if [[ "$status" -ne 1 ]]; then
            echo "Expected skills-ref to return 1 for the invalid fixture, got $status" >&2
            exit 1
          fi
          skills-ref validate tests/fixtures/bad--name
          invalid_boundary_status=$?
          skills-ref validate tests/fixtures/extension-skill
          extension_status=$?
          set -e
          if [[ "$invalid_boundary_status" -ne 1 ]]; then
            echo "Expected skills-ref to reject the invalid boundary fixture with status 1, got $invalid_boundary_status" >&2
            exit 1
          fi
          if [[ "$extension_status" -ne 1 ]]; then
            echo "Expected pinned skills-ref to reject an unknown extension field (policy divergence), got $extension_status" >&2
            exit 1
          fi
          set +e
          skills-ref validate tests/fixtures/ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé
          unicode_invalid_status=$?
          set -e
          if [[ "$unicode_invalid_status" -ne 1 ]]; then
            echo "Expected skills-ref to reject the 65-character Unicode name fixture with status 1, got $unicode_invalid_status" >&2
            exit 1
          fi
