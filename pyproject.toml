[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skilltether"
version = "0.1.0"
description = "Local-first localization and integrity checks for Agent Skill packages"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
dependencies = ["markdown-it-py>=3.0.0", "pydantic>=2.8.0", "PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "hypothesis>=6.112.0", "coverage[toml]>=7.6.0", "jsonschema>=4.23.0"]

[project.scripts]
skilltether = "skilltether.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["skilltether"]
